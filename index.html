<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Point à la ligne Tatouages — Flashbook</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="book">

  <!-- LOGO -->

  <section class="page">
    <img src="images/01-accueil.jpg" alt="Accueil Point à la ligne Tatouages">
  </section>

  <!-- FLASHBOOK -->

  <section class="page">
    <img src="images/02-flashbook.jpg" alt="Flashbook Point à la ligne Tatouages">

  </section>

  <!-- INSTRUCTIONS -->

  <section class="page">
    <img src="images/03-instructions-1.jpg" alt="">
  </section>

  <section class="page">
    <img src="images/03-instructions-2.jpg" alt="">
  </section>

  <!-- CHOIX FLASHBOOK -->

  <section class="page" id="choix-flashbook">

    <img src="images/02-flashbookchoix.jpg" alt="Choix des catégories">

    <!-- BOUTONS CATÉGORIES -->

    <a href="#curiosites"
       class="overlay-button curiosites-button">
    </a>

    <a href="#faune"
       class="overlay-button faune-button">
    </a>

    <a href="#ornemental"
       class="overlay-button ornemental-button">
    </a>

  </section>

  <!-- CURIOSITÉS -->

  <section class="page" id="curiosites">
    <img src="images/c-accueil.jpg" alt="">
  </section>

  <div id="curiosites-gallery"></div>

  <!-- FAUNE & FLORE -->

  <section class="page" id="faune">
    <img src="images/f-accueil.jpg" alt="">
  </section>

  <div id="faune-gallery"></div>

  <!-- ORNEMENTAL -->

  <section class="page" id="ornemental">
    <img src="images/o-accueil.jpg" alt="">
  </section>

  <div id="ornemental-gallery"></div>

  <!-- PETIT BUDGET -->

  <section class="page">

    <img src="images/04-petitbudget.jpg" alt="Petit budget">

    <a href="#mini"
       class="overlay-button mini-button">
    </a>

  </section>

  <!-- MINI FLASHS -->

  <section class="page" id="mini">
    <img src="images/mini-text1.jpg" alt="">
  </section>

  <div id="mini-gallery"></div>

  <section class="page">
    <img src="images/mini-text2.jpg" alt="">
  </section>

  <!-- CONTACT -->

  <section class="page">

    <img src="images/05-contact.jpg" alt="Contact">

    <a href="mailto:pointalaligne.tattoo@gmail.com"
       class="overlay-button mail-button">
    </a>

    <a href="https://www.instagram.com/pointalaligne_tattoo/"
       target="_blank"
       class="overlay-button instagram-button">
    </a>

  </section>

<main class="book" id="top">

<script src="script.js"></script>

<a href="#top" class="back-to-top">↑</a>

</body>
</html>
